name: Check Pull Request Health

on:
    pull_request:
        types:
            - opened
            - synchronize

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20.x, 22.x, 24.x, 26.x]

        timeout-minutes: 60
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install dependencies
              run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund

            # The current-forward lint config needs Node >=24.10; runtime checks stay on all supported majors.
            - name: Lint the codebase
              if: matrix.node-version == '24.x'
              run: npm run lint
              env:
                  CI: true

            - name: Test the codebase
              run: npm run test -- --runInBand
              env:
                  CI: true

            - name: Build the codebase
              run: npm run build

    release-safety:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: '24.20.0'
            - run: node --test .github/scripts/*.test.mjs
