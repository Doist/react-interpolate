name: Publish retained react-interpolate artifact

on:
    workflow_dispatch:
        inputs:
            source_run_id:
                description: Original successful pack.yml run (never repack for a retry)
                required: true
                type: string
            source_attempt:
                description: Original successful run attempt
                required: true
                default: '1'
                type: string
            version:
                description: Exact retained version (first migration release 2.2.5)
                required: true
                type: string
            destination:
                description: GitHub mirror after terminal npm bootstrap; both for later OIDC releases
                required: true
                default: both
                type: choice
                options: [both, npm, github]
            dist_tag:
                description: Use recovery for an older missing mirror, preserving latest
                required: true
                default: latest
                type: choice
                options: [latest, recovery]
            record_release:
                description: Create the normal v<version> release record only after both copies match
                required: true
                default: false
                type: boolean

permissions:
    contents: read

concurrency:
    group: react-interpolate-publication
    cancel-in-progress: false

jobs:
    publish:
        if: github.repository == 'todoist/react-interpolate' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: package-release
        permissions:
            contents: write
            actions: read
            packages: write
            id-token: write
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v6
              with:
                  node-version: '24.20.0'
            - run: npm install --global npm@11.21.2 --ignore-scripts
            - name: Validate originating run and publish or verify the identical artifact
              env:
                  SOURCE_RUN: ${{ inputs.source_run_id }}
                  SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
                  VERSION: ${{ inputs.version }}
                  DESTINATION: ${{ inputs.destination }}
                  DIST_TAG: ${{ inputs.dist_tag }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: node .github/scripts/release.mjs publish "$SOURCE_RUN" "$SOURCE_ATTEMPT" "$VERSION" "$DESTINATION" "$DIST_TAG"
            - name: Record the normal semantic-release baseline after both registries pass
              if: inputs.record_release
              env:
                  SOURCE_RUN: ${{ inputs.source_run_id }}
                  SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
                  VERSION: ${{ inputs.version }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: node .github/scripts/release.mjs record "$SOURCE_RUN" "$SOURCE_ATTEMPT" "$VERSION"
