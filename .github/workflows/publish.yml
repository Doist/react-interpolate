name: Publish retained react-interpolate artifact

on:
    workflow_dispatch:
        inputs:
            source_run_id:
                description: Original successful pack.yml run (never repack for a retry)
                required: true
                type: string
            source_attempt:
                description: Original successful run attempt
                required: true
                default: '1'
                type: string
            version:
                description: Exact retained version (first migration release 2.2.5)
                required: true
                type: string
            destination:
                description: GitHub mirror after terminal npm bootstrap; both for later OIDC releases
                required: true
                default: both
                type: choice
                options: [both, npm, github]
            dist_tag:
                description: Preserve the artifact latest/next channel; recovery never moves that channel
                required: true
                default: channel
                type: choice
                options: [channel, recovery]
            record_release:
                description: Create the normal v<version> release record only after both copies match
                required: true
                default: false
                type: boolean

permissions:
    contents: read

concurrency:
    group: react-interpolate-release
    cancel-in-progress: false

jobs:
    publish:
        if: github.repository == 'todoist/react-interpolate' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: package-release
        permissions:
            contents: write
            actions: read
            packages: write
            id-token: write
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v6
              with:
                  node-version: '24.20.0'
            - run: npm install --global npm@11.21.2 --ignore-scripts
            - name: Validate originating run and publish or verify the identical artifact
              env:
                  SOURCE_RUN: ${{ inputs.source_run_id }}
                  SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
                  VERSION: ${{ inputs.version }}
                  DESTINATION: ${{ inputs.destination }}
                  DIST_TAG: ${{ inputs.dist_tag }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if [ "$DIST_TAG" = channel ]; then DIST_TAG=""; fi
                  node .github/scripts/release.mjs publish "$SOURCE_RUN" "$SOURCE_ATTEMPT" "$VERSION" "$DESTINATION" "$DIST_TAG"
            - name: Generate the existing release bot token for commitback and records
              if: inputs.record_release
              id: generate_token
              uses: actions/create-github-app-token@v3
              with:
                  app-id: ${{ secrets.DOIST_RELEASE_BOT_ID }}
                  private-key: ${{ secrets.DOIST_RELEASE_BOT_PRIVATE_KEY }}
                  permission-contents: write
            - name: Get the release bot identity
              if: inputs.record_release
              id: bot_user
              env:
                  GH_TOKEN: ${{ steps.generate_token.outputs.token }}
                  BOT_SLUG: ${{ steps.generate_token.outputs.app-slug }}
              run: |
                  user_id=$(gh api "/users/${BOT_SLUG}[bot]" --jq .id)
                  test -n "$user_id"
                  echo "id=$user_id" >> "$GITHUB_OUTPUT"
            - name: Record normal version, changelog, tag and channel after both registries pass
              if: inputs.record_release
              env:
                  SOURCE_RUN: ${{ inputs.source_run_id }}
                  SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
                  VERSION: ${{ inputs.version }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_RECORD_TOKEN: ${{ steps.generate_token.outputs.token }}
                  GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GIT_AUTHOR_NAME: ${{ steps.generate_token.outputs.app-slug }}[bot]
                  GIT_AUTHOR_EMAIL: ${{ steps.bot_user.outputs.id }}+${{ steps.generate_token.outputs.app-slug }}[bot]@users.noreply.github.com
                  GIT_COMMITTER_NAME: ${{ steps.generate_token.outputs.app-slug }}[bot]
                  GIT_COMMITTER_EMAIL: ${{ steps.bot_user.outputs.id }}+${{ steps.generate_token.outputs.app-slug }}[bot]@users.noreply.github.com
              run: node .github/scripts/release.mjs record "$SOURCE_RUN" "$SOURCE_ATTEMPT" "$VERSION"
